spring:
  datasource:
    url: jdbc:h2:file:./data/sot-reception;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

# Быстрый локальный старт без Postgres: mvn spring-boot:run (профиль h2 активен по умолчанию).
