services:
  postgres:
    image: postgres:16-alpine
    container_name: sot-reception-postgres
    environment:
      POSTGRES_DB: sot_reception
      POSTGRES_USER: sot_reception
      POSTGRES_PASSWORD: sot_reception
    ports:
      - "5432:5432"
    volumes:
      - sot_reception_pgdata:/var/lib/postgresql/data

volumes:
  sot_reception_pgdata:
